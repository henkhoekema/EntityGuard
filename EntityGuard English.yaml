entityguard:
  # v2026.7.3
  alias: EntityGuard
  icon: mdi:home-automation

  ###############################################################
  # Parameters (required)
  ###############################################################
  fields:

    description:
      name: Description
      description: >
        Short description of the action.
        Used in notifications and logging.
        Has no impact on the script’s behavior.

    entity_id:
      name: Entity
      description: >
        The entity on which the action will be executed.
        Must be a valid Home Assistant entity.
        Example: light.erker_licht

    action:
      name: Action
      description: >
        The Home Assistant action that should be executed.
        This may be either 'service:' (deprecated) or 'action:' (recommended).
        Example: switch.turn_on, light.turn_off, cover.open_cover

    ###############################################################
    # Parameters (optional)
    #
    # These parameters influence EntityGuard’s behavior.
    # If omitted, safe default values are used automatically.
    #
    # 'data' is passed directly to the action.
    #
    # When 'data' is not provided, an empty dictionary ({}) is used.
    ###############################################################

    data:
      name: Data
      description: >
        Optional service data sent directly to the action.
        Use this for brightness, color, speed, mode, etc.
        Example:
          data:
            brightness_pct: 50

    retries:
      name: Retries
      description: >
        Number of attempts EntityGuard will make to reach the desired state.
        default: 3 attempts.
        Increase this for slow Zigbee/Z-Wave/WiFi devices.

    timeout:
      name: Timeout
      description: >
        Maximum time (in seconds) the script may run.
        default: 15 seconds.
        If the total retry time exceeds the timeout,
        the script stops automatically.

    retry_delay:
      name: Retry delay
      description: >
        Delay between attempts.
        default: 5 seconds.
        Increase this for devices that update their status slowly.

    backoff_mode:
      name: Backoff method
      description: >
        Method for waiting time between retries.
        Options:
          - exponential
          - linear (default)
          - constant

        Exponential:
          Waiting time increases quickly per attempt.
          Example: 5 → 10 → 20 → 40 → 80 sec

        Linear:
          Waiting time increases slowly per attempt.
          Example: 5 → 7 → 9 → 11 → 13 sec

        Constant:
          Waiting time remains equal to retry_delay.
          Example: 5 → 5 → 5 → 5 → 5 sec

    state_delay:
      name: State delay
      description: >
        Delay after executing the action before checking the status.
        Important for Zigbee & WiFi devices that report status slowly.
        default: 2 seconds.

        Example:
          00.0 sec  light.turn_on sent
          00.2 sec  Light turns on
          00.8 sec  Status is reported back in Home Assistant

    notify:
      name: Notification
      description: >
        Whether a notification should be sent on success or failure.
        default: true.
        Set to false for silent actions.

    notify_target:
      name: Notify target
      description: >
        The notify service where messages should be sent.
        Examples: notify.mobile_app_henk, notify.telegram_henk, notify.henk
        Default: notify.henk

  ###############################################################
  # Script
  ###############################################################
  sequence:

    ###############################################################
    # Default settings
    ###############################################################
    - variables:
        retries: "{{ retries | default(3) }}"
        timeout: "{{ timeout | default(15) }}"
        retry_delay: "{{ retry_delay | default(5) }}"
        backoff_mode: "{{ backoff_mode | default('linear') }}"
        state_delay: "{{ state_delay | default(2) }}"
        notify: "{{ notify | default(true) }}"
        notify_target: "{{ notify_target | default('notify.henk') }}"

        ###############################################################
        # Other variables
        ###############################################################
        domain: "{{ action.split('.')[0] }}"
        action_name: "{{ action.split('.')[1] }}"
        current_state: "{{ states(entity_id) }}"

        ###############################################################
        # Supported states per domain
        ###############################################################
        supported_states: >
          {% if domain in ['switch','light','input_boolean','fan','group','homeassistant','scene'] %}
            ['on','off']
          {% elif domain == 'cover' %}
            ['open','closed','stopped']
          {% elif domain == 'lock' %}
            ['locked','unlocked']
          {% elif domain == 'vacuum' %}
            ['cleaning','paused','returning','docked']
          {% elif domain == 'media_player' %}
            ['on','off','playing','paused','idle']
          {% elif domain == 'climate' %}
            ['off','heat','cool','auto','dry','fan_only']
          {% elif domain == 'humidifier' %}
            ['on','off']
          {% elif domain == 'dehumidifier' %}
            ['on','off']
          {% elif domain == 'water_heater' %}
            ['on','off']
          {% elif domain == 'alarm_control_panel' %}
            ['armed_away','armed_home','armed_night','disarmed']
          {% else %}
            []
          {% endif %}

        ###############################################################
        # Used for Google Sheets
        ###############################################################
        start_time: "{{ now().timestamp() }}"

        ###############################################################
        # Supported actions and expected end state
        ###############################################################
        expected_state: >
          {% if action_name == 'toggle' %}
            {% if current_state == 'on' %}off
            {% elif current_state == 'off' %}on
            {% else %}unknown{% endif %}
          {% else %}
            {% if action_name == 'turn_on' %}on
            {% elif action_name == 'turn_off' %}off
            {% elif action_name == 'open_cover' %}open
            {% elif action_name == 'close_cover' %}closed
            {% elif action_name == 'stop_cover' %}stopped
            {% elif action_name == 'lock' %}locked
            {% elif action_name == 'unlock' %}unlocked
            {% elif action_name == 'start' %}cleaning
            {% elif action_name == 'pause' %}paused
            {% elif action_name == 'return_to_base' %}returning
            {% elif action_name == 'media_play' %}playing
            {% elif action_name == 'media_pause' %}paused
            {% elif action_name == 'media_stop' %}idle
            {% elif action_name == 'set_hvac_mode' %}
              {{ data.hvac_mode | default('unknown') }}
            {% else %}
              unknown
            {% endif %}
          {% endif %}

    ###############################################################
    # Check if the action is supported
    ###############################################################
    - if:
        - condition: template
          value_template: "{{ expected_state == 'unknown' }}"
      then:
        - stop: >
            Script aborted.

            Unknown action.
            Check whether the action is valid for this domain.

            Supported domains:

              switch
              light
              input_boolean
              fan
              group
              homeassistant
              scene
              media_player
              cover
              lock
              vacuum
              climate
              humidifier
              dehumidifier
              water_heater
              alarm_control_panel

    ###############################################################
    # Check if the entity exists
    ###############################################################
    - if:
        - condition: template
          value_template: "{{ states(entity_id) in ['unknown','unavailable'] }}"
      then:
        - stop: >
            Script aborted.

            The specified entity does not exist or is unavailable.

    ###############################################################
    # Special handling for scenes: no state check
    ###############################################################
    - if:
        - condition: template
          value_template: "{{ domain == 'scene' }}"
      then:
        - action: "{{ action }}"
          target:
            entity_id: "{{ entity_id }}"
          data: "{{ data | default({}) }}"

        - event: entityguard_done
          event_data:
            description: "{{ description }}"
            entity: "{{ entity_id }}"
            action: "{{ action }}"
            result: "OK"
            duration: "{{ (now().timestamp() - start_time) | round(2) }}"
            attempt: 1
            retries: "{{ retries }}"
            timeout: "{{ timeout }}"
            state_delay: "{{ state_delay }}"
            backoff_mode: "{{ backoff_mode }}"

        - stop: "Scene executed (no state check)"

    ###############################################################
    # Actual retries start here
    ###############################################################
    - repeat:
        count: "{{ retries }}"
        sequence:

          - action: "{{ action }}"
            target:
              entity_id: "{{ entity_id }}"
            data: "{{ data | default({}) }}"

          - if:
              - condition: template
                value_template: "{{ state_delay > 0 }}"
            then:
              - delay:
                  seconds: "{{ state_delay }}"

          - variables:
              check_state: "{{ is_state(entity_id, expected_state) }}"

          - wait_template: "{{ check_state }}"
            timeout:
              seconds: "{{ timeout }}"
            continue_on_timeout: true

          - if:
              - condition: template
                value_template: "{{ check_state }}"
            then:
              - event: entityguard_done
                event_data:
                  description: "{{ description }}"
                  entity: "{{ entity_id }}"
                  action: "{{ action }}"
                  result: "OK"
                  duration: "{{ (now().timestamp() - start_time) | round(2) }}"
                  attempt: "{{ repeat.index }}"
                  retries: "{{ retries }}"
                  timeout: "{{ timeout }}"
                  state_delay: "{{ state_delay }}"
                  backoff_mode: "{{ backoff_mode }}"

              - stop: "Action succeeded."

          - if:
              - condition: template
                value_template: "{{ repeat.index < retries }}"
            then:
              - delay:
                  seconds: >
                    {% if backoff_mode == 'constant' %}
                      {{ retry_delay }}
                    {% elif backoff_mode == 'linear' %}
                      {{ retry_delay * repeat.index }}
                    {% elif backoff_mode == 'exponential' %}
                      {{ retry_delay * (2 ** (repeat.index - 1)) }}
                    {% else %}
                      {{ retry_delay }}
                    {% endif %}

    ###############################################################
    # All retries failed
    ###############################################################
    - event: entityguard_done
      event_data:
        description: "{{ description }}"
        entity: "{{ entity_id }}"
        action: "{{ action }}"
        result: "FAILED"
        duration: "{{ (now().timestamp() - start_time) | round(2) }}"
        attempt: "{{ retries }}"
        retries: "{{ retries }}"
        timeout: "{{ timeout }}"
        state_delay: "{{ state_delay }}"
        backoff_mode: "{{ backoff_mode }}"

    ###############################################################
    # Send notification only when notify=True
    ###############################################################
    - if:
        - condition: template
          value_template: "{{ notify }}"
      then:
        - service: "{{ notify_target }}"
          data:
            title: "⚠️ EntityGuard"
            message: |
              Description : {{ description }}
              Entity      : {{ entity_id }}
              Action      : {{ action }}
              Expected    : {{ expected_state }}
              Retries     : {{ retries }}
              Timeout     : {{ timeout }} sec
              Result      : FAILED
            data:
              ttl: 0
              priority: high
              clickAction: "noAction"

  ###############################################################
  # Store last traces
  ###############################################################
  trace:
    stored_traces: 10

  ###############################################################
  # queued prevents multiple automations from interrupting each other
  ###############################################################
  mode: queued
