  entityguard:
    # v2026.7.3
    alias: EntityGuard
    icon: mdi:home-automation
  
    ###############################################################
    # Parameters (verplicht)
    ###############################################################
    fields:

      description:
        name: Omschrijving
        description: >
          Korte beschrijving van de actie.
          Wordt gebruikt in notificaties en logging.
          Heeft geen invloed op de werking van het script.

      entity_id:
        name: Entity
        description: >
          De entity waarop de actie wordt uitgevoerd.
          Moet een geldige Home Assistant entity zijn.
          Voorbeeld: light.erker_licht

      action:
        name: Actie
        description: >
          De Home Assistant actie die uitgevoerd moet worden.
          Dit mag zowel 'service:' (verouderd) als 'action:' (aanbevolen) zijn.
          Voorbeeld: switch.turn_on, light.turn_off, cover.open_cover

      ###############################################################
      # Parameters (optioneel)
      #
      # Deze parameters worden gebruikt om het gedrag van EntityGuard
      # te beïnvloeden. Als je ze weglaat, worden automatisch
      # veilige standaardwaarden gebruikt.
      #
      # 'data' wordt rechtstreeks doorgestuurd naar de actie.
      #
      # Wanneer 'data' niet wordt opgegeven, wordt automatisch
      # een lege dictionary ({}) gebruikt.
      ###############################################################

      data:
        name: Data
        description: >
          Optionele service-data die direct wordt meegestuurd naar de actie.
          Gebruik dit voor brightness, kleur, snelheid, modus, etc.
          Voorbeeld:
            data:
              brightness_pct: 50

      retries:
        name: Pogingen
        description: >
          Aantal keren dat EntityGuard probeert om de gewenste state te bereiken.
          default: 3 pogingen.
          Verhoog dit bij trage Zigbee/Z-Wave/Wifi apparaten.

      timeout:
        name: Timeout
        description: >
          Maximale tijd (in seconden) die het script mag duren.
          default: 15 seconden.
          Als de totale retry-tijd langer wordt dan de timeout,
          stopt het script automatisch.

      retry_delay:
        name: Retry delay
        description: >
          Wachtduur tussen pogingen.
          default: 5 seconden.
          Verhoog dit bij apparaten die langzaam hun status updaten.

      backoff_mode:
        name: Backoff methode
        description: >
          Methode voor wachttijd tussen retries.
          Mogelijkheden:
            - exponential 
            - linear (default)
            - constant

          Exponential:
            Wachttijd neemt snel toe per poging.
            Voorbeeld: 5 → 10 → 20 → 40 → 80 sec

          Linear:
            Wachttijd neemt langzaam toe per poging.
            Voorbeeld: 5 → 7 → 9 → 11 → 13 sec

          Constant:
            Wachttijd blijft exact gelijk aan retry_delay.
            Voorbeeld: 5 → 5 → 5 → 5 → 5 sec

      state_delay:
        name: State delay
        description: >
          Wachtduur na het uitvoeren van de actie voordat de status wordt gecontroleerd.
          Dit is belangrijk voor Zigbee & Wifi-apparaten die hun status vertraagd doorgeven.
          default: 2 seconden.

          Voorbeeld:
            00,0 sec  light.turn_on verstuurd
            00,2 sec  Lamp gaat aan
            00,8 sec  Status komt pas terug in Home Assistant

      notify:
        name: Notificatie
        description: >
          Of er een notificatie gestuurd moet worden bij succes of mislukking.
          default: true.
          Zet op false voor stille acties.

      notify_target:
        name: Notify target
        description: >
          De notify-service waar meldingen naartoe gestuurd moeten worden.
          Voorbeelden: notify.mobile_app_henk, notify.telegram_henk, notify.mobile_app_iphone_van_henk
          Default: notify.mobile_app_henk

    ###############################################################
    # Script
    ###############################################################
    sequence:

      ###############################################################
      # Default instellingen
      ###############################################################
      - variables:
          retries: "{{ retries | default(3) }}"              # Aantal pogingen
          timeout: "{{ timeout | default(15) }}"             # Timeout voor wait_template
          retry_delay: "{{ retry_delay | default(5) }}"      # Delay tussen pogingen
          backoff_mode: "{{ backoff_mode | default('linear') }}"  # Backoff methode
          state_delay: "{{ state_delay | default(2) }}"      # Wacht voor statuscontrole
          notify: "{{ notify | default(true) }}"             # Notificatie aan/uit
          notify_target: "{{ notify_target | default('mobile_app_henk') }}"


          ###############################################################
          # Andere variabelen
          ###############################################################
          domain: "{{ action.split('.')[0] }}"               # Domeinnaam uit actie
          action_name: "{{ action.split('.')[1] }}"          # Actienaam uit actie
          current_state: "{{ states(entity_id) }}"           # Huidige status van entity

          ###############################################################
          # Ondersteunde states per domein
          ###############################################################
          supported_states: >
            {% if domain in ['switch','light','input_boolean','fan','group','homeassistant','scene'] %}
              ['on','off']
            {% elif domain == 'cover' %}
              ['open','closed','stopped']
            {% elif domain == 'lock' %}
              ['locked','unlocked']
            {% elif domain == 'vacuum' %}
              ['cleaning','paused','returning','docked']
            {% elif domain == 'media_player' %}
              ['on','off','playing','paused','idle']
            {% elif domain == 'climate' %}
              ['off','heat','cool','auto','dry','fan_only']
            {% elif domain == 'humidifier' %}
              ['on','off']
            {% elif domain == 'dehumidifier' %}
              ['on','off']
            {% elif domain == 'water_heater' %}
              ['on','off']
            {% elif domain == 'alarm_control_panel' %}
              ['armed_away','armed_home','armed_night','disarmed']
            {% else %}
              []
            {% endif %}

          ###############################################################
          # Wordt gebruikt voor Google Sheets
          ###############################################################
          start_time: "{{ now().timestamp() }}"

          ###############################################################
          # Ondersteunde acties en bijbehorende eindstatus.
          ###############################################################
          expected_state: >
            {% if action_name == 'toggle' %}
              {% if current_state == 'on' %}off
              {% elif current_state == 'off' %}on
              {% else %}unknown{% endif %}
            {% else %}
              {% if action_name == 'turn_on' %}on
              {% elif action_name == 'turn_off' %}off
              {% elif action_name == 'open_cover' %}open
              {% elif action_name == 'close_cover' %}closed
              {% elif action_name == 'stop_cover' %}stopped
              {% elif action_name == 'lock' %}locked
              {% elif action_name == 'unlock' %}unlocked
              {% elif action_name == 'start' %}cleaning
              {% elif action_name == 'pause' %}paused
              {% elif action_name == 'return_to_base' %}returning
              {% elif action_name == 'media_play' %}playing
              {% elif action_name == 'media_pause' %}paused
              {% elif action_name == 'media_stop' %}idle
              {% elif action_name == 'set_hvac_mode' %}
                {{ data.hvac_mode | default('unknown') }}
              {% else %}
                unknown
              {% endif %}
            {% endif %}

      ###############################################################
      # Controleer of de opgegeven actie ondersteund wordt.
      ###############################################################
      - if:
          - condition: template
            value_template: "{{ expected_state == 'unknown' }}"
        then:
          - stop: >
              Script afgebroken.

              Onbekende actie.
              Controleer of de actie geldig is voor dit domein.

              Ondersteunde domeinen:

                switch
                light
                input_boolean
                fan
                group
                homeassistant
                scene
                media_player
                cover
                lock
                vacuum
                climate
                humidifier
                dehumidifier
                water_heater
                alarm_control_panel

      ###############################################################
      # Controleer of de entity bestaat.
      ###############################################################
      - if:
          - condition: template
            value_template: "{{ states(entity_id) in ['unknown','unavailable'] }}"
        then:
          - stop: >
              Script afgebroken.

              De opgegeven entity bestaat niet of is niet beschikbaar.

      ###############################################################
      # Speciale behandeling voor scenes: geen state-controle.
      ###############################################################
      - if:
          - condition: template
            value_template: "{{ domain == 'scene' }}"
        then:
          - action: "{{ action }}"
            target:
              entity_id: "{{ entity_id }}"
            data: "{{ data | default({}) }}"

          ###############################################################
          # Wordt gebruikt voor Google Sheets
          ###############################################################
          - event: entityguard_klaar
            event_data:
              description: "{{ description }}"
              entity: "{{ entity_id }}"
              action: "{{ action }}"
              result: "OK"
              duration: "{{ (now().timestamp() - start_time) | round(2) }}"
              poging: 1
              retries: "{{ retries }}"
              timeout: "{{ timeout }}"
              state_delay: "{{ state_delay }}"
              backoff_mode: "{{ backoff_mode }}"

          - stop: "Scene uitgevoerd (geen state-controle)"

      ###############################################################
      # Pas hier beginnen de daadwerkelijke retries.
      ###############################################################
      - repeat:
          count: "{{ retries }}"
          sequence:

            ###########################################################
            # Verstuur de action.
            ###########################################################
            - action: "{{ action }}"
              target:
                entity_id: "{{ entity_id }}"
              data: "{{ data | default({}) }}"

            ###########################################################
            # Wacht voordat de status gecontroleerd wordt.
            ###########################################################
            - if:
                - condition: template
                  value_template: "{{ state_delay > 0 }}"
              then:
                - delay:
                    seconds: "{{ state_delay }}"

            ###########################################################
            # check_state opnieuw berekenen
            ###########################################################
            - variables:
                check_state: "{{ is_state(entity_id, expected_state) }}"

            ###########################################################
            # Wacht totdat de gewenste status bereikt is.
            ###########################################################
            - wait_template: "{{ check_state }}"
              timeout:
                seconds: "{{ timeout }}"
              continue_on_timeout: true

            ###########################################################
            # Gelukt?
            ###########################################################
            - if:
                - condition: template
                  value_template: "{{ check_state }}"
              then:

                ###############################################################
                # Wordt gebruikt voor Google Sheets
                ###############################################################
                - event: entityguard_klaar
                  event_data:
                    description: "{{ description }}"
                    entity: "{{ entity_id }}"
                    action: "{{ action }}"
                    result: "OK"
                    duration: "{{ (now().timestamp() - start_time) | round(2) }}"
                    poging: "{{ repeat.index }}"
                    retries: "{{ retries }}"
                    timeout: "{{ timeout }}"
                    state_delay: "{{ state_delay }}"
                    backoff_mode: "{{ backoff_mode }}"

                - stop: "Actie geslaagd."

            ###########################################################
            # Alleen wachten als nog een retry volgt.
            ###########################################################
            - if:
                - condition: template
                  value_template: "{{ repeat.index < retries }}"
              then:
                - delay:
                    seconds: >
                      {% if backoff_mode == 'constant' %}
                        {{ retry_delay }}
                      {% elif backoff_mode == 'linear' %}
                        {{ retry_delay * repeat.index }}
                      {% elif backoff_mode == 'exponential' %}
                        {{ retry_delay * (2 ** (repeat.index - 1)) }}
                      {% else %}
                        {{ retry_delay }}
                      {% endif %}

      ###############################################################
      # Alle retries zijn mislukt.
      ###############################################################

      ###############################################################
      # Wordt gebruikt voor Google Sheets
      ###############################################################
      - event: entityguard_klaar
        event_data:
          description: "{{ description }}"
          entity: "{{ entity_id }}"
          action: "{{ action }}"
          result: "MISLUKT"
          duration: "{{ (now().timestamp() - start_time) | round(2) }}"
          poging: "{{ retries }}"
          retries: "{{ retries }}"
          timeout: "{{ timeout }}"
          state_delay: "{{ state_delay }}"
          backoff_mode: "{{ backoff_mode }}"

      ###############################################################
      # Alleen een notificatie versturen wanneer notify=True.
      ###############################################################
      - if:
          - condition: template
            value_template: "{{ notify }}"
        then:
          - service: "{{ notify_target }}"
            data:
              title: "⚠️ EntityGuard"
              message: |
                Omschrijving : {{ description }}
                Entity       : {{ entity_id }}
                Actie        : {{ action }}
                Gewenst      : {{ expected_state }}
                Pogingen     : {{ retries }}
                Timeout      : {{ timeout }} sec
                Resultaat    : MISLUKT
              data:
                ttl: 0
                priority: high
                clickAction: "noAction"

    ###############################################################
    # Bewaar de laatste traces.
    ###############################################################
    trace:
      stored_traces: 10

    ###############################################################
    # queued voorkomt dat meerdere automations elkaar onderbreken.
    ###############################################################
    mode: queued